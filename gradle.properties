# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# AndroidX (the project uses androidx.* support libraries)
android.useAndroidX=true
android.enableJetifier=false
# Keep the generated R class transitive so the original R.layout / R.id / R.drawable
# references (written against a single app module) resolve without changes.
android.nonTransitiveRClass=false
